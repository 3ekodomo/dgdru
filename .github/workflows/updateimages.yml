name: Bulk Update Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Markdown, Download, and Clean File
        run: |
          python3 -c "
          import re, urllib.request, os
          
          file_path = 'images/image.md'
          try:
              with open(file_path, 'r') as f:
                  lines = f.readlines()
          except FileNotFoundError:
              print(f'{file_path} not found. Exiting.')
              exit(1)
              
          new_lines = []
          pattern = re.compile(r'\[(.*?)\]\((.*?)\)')
          
          for line in lines:
              match = pattern.search(line)
              if match:
                  filename, url = match.groups()
                  filepath = os.path.join('images', filename)
                  print(f'Downloading {url} to {filepath}...')
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req) as response, open(filepath, 'wb') as out_file:
                          out_file.write(response.read())
                      print(f'Success! Removing entry for {filename}.')
                      continue
                  except Exception as e:
                      print(f'Failed to download {url}: {e}')
                      new_lines.append(line)
              else:
                  new_lines.append(line)
                  
          with open(file_path, 'w') as f:
              f.writelines(new_lines)
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add images/
          
          git diff --staged --quiet || (git commit -m "chore: bulk update images and clean list" && git push)
